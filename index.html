<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Analytix - Maç Bülteni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Sports Analytix Dashboard</h1>
            <p>Canlı Veritabanı Entegrasyonlu Maç ve Oran Paneli</p>
        </header>

        <main>
            <div class="card">
                <h2>Yaklaşan Maçlar</h2>
                <table id="matches-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tarih</th>
                            <th>Ev Sahibi</th>
                            <th>Deplasman</th>
                            <th>MS 1</th>
                            <th>MS X</th>
                            <th>MS 2</th>
                        </tr>
                    </thead>
                    <tbody id="matches-body">
                        <!-- Veriler JavaScript ile buraya akacak -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        // API'den veri çekip tabloya basan fonksiyon
        async function fetchMatches() {
            try {
                const response = await fetch('http://localhost:5000/api/matches');
                const matches = await response.json();
                
                const tableBody = document.getElementById('matches-body');
                tableBody.innerHTML = '';

                matches.forEach(match => {
                    const row = document.createElement('tr');
                    
                    // Tarih formatlama
                    const matchDate = new Date(match.match_date).toLocaleString('tr-TR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    row.innerHTML = `
                        <td>${match.match_id}</td>
                        <td>${matchDate}</td>
                        <td><strong>${match.home_team}</strong></td>
                        <td><strong>${match.away_team}</strong></td>
                        <td><span class="badge odd">${match.home_win_odd}</span></td>
                        <td><span class="badge odd">${match.draw_odd}</span></td>
                        <td><span class="badge odd">${match.away_win_odd}</span></td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Veri çekme hatası:', error);
            }
        }

        // Sayfa yüklendiğinde çalıştır
        fetchMatches();
    </script>
</body>
</html>
